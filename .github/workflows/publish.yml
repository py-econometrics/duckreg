name: Build distributions and publish to PyPI

on:
  pull_request:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || (github.repository == 'py-econometrics/duckreg' && !github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'release' && '0' || '1' }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.12"

      - name: Verify release tag and source
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/master
          uv run --no-project python - <<'PY'
          import os
          from pathlib import Path
          import re
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version) or tag != f"v{version}":
              raise SystemExit("The release tag must be vX.Y.Z and match project.version.")
          PY

      - name: Test the release commit
        if: github.event_name == 'release'
        run: |
          uv sync --locked --no-dev --extra test
          uv run --no-sync pytest

      - name: Build and validate the wheel and source distribution
        run: |
          uv build
          uvx twine@6.2.0 check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' && github.repository == 'py-econometrics/duckreg' && !github.event.release.prerelease && !github.event.release.draft
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/duckreg/
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
